<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Essex League — matchweek</title>
<link rel="stylesheet" href="static/app.css">
<style>
  /* matchweek-specific tweaks on top of app.css */
  .picker { display: flex; gap: 8px; align-items: center; padding: 12px 16px; }
  .picker select { flex: 1; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  .picker .built { font-size: 11px; color: #888; padding: 0 16px 8px; }
  .div-h { font-size: 13px; font-weight: 600; color: #555; text-transform: uppercase;
           letter-spacing: 0.5px; padding: 10px 16px 4px; background: #f4f5f8; }
  .game { background: #fff; border-bottom: 1px solid #eaeaea; padding: 12px 16px; }
  .game-head { display: flex; justify-content: space-between; align-items: baseline; }
  .game-status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
  .status-completed { background: #e8f5e9; color: #2e7d32; }
  .status-in_progress { background: #fff3e0; color: #ef6c00; }
  .status-scheduled { background: #e3f2fd; color: #1565c0; }
  .status-abandoned { background: #fafafa; color: #999; }
  .teams { font-weight: 600; font-size: 15px; line-height: 1.3; margin: 4px 0 6px; }
  .vs { color: #999; font-weight: 400; font-size: 13px; }
  .ground { font-size: 12px; color: #888; margin-bottom: 6px; }
  .innings { background: #f9f9fb; border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .innings-h { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
  .innings-score { font-variant-numeric: tabular-nums; }
  .perf { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; }
  .perf .pill { background: #fff; border: 1px solid #ddd; border-radius: 12px;
                color: #333; font-family: inherit; font-weight: 400;
                padding: 1px 8px; line-height: 1.5; }
  .result { font-size: 12px; color: #444; margin-top: 6px; font-style: italic; }
  .winprob { font-size: 12px; color: #102a43; background: linear-gradient(90deg, #f0f7ff, #f7faff); border-left: 3px solid #1565c0; padding: 6px 10px; margin-top: 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .empty { padding: 20px; text-align: center; color: #888; }
  a.match-link { color: #1565c0; text-decoration: none; font-size: 11px; }
  a.match-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<header class="hero">
  <div class="bc"><a href="index.html">Home</a> · matchweek</div>
  <h1>Essex League — matchweek</h1>
  <p class="lead">5 games from each of the top 5 1st-XI divisions.
  Live scores hit the Play-Cricket API directly; rebuilt hourly via cron.</p>
</header>

<main>
  <div class="picker">
    <label for="mw" style="font-weight:600;">Matchweek:</label>
    <select id="mw"></select>
  </div>
  <div id="built" class="built"></div>
  <div id="content"></div>
</main>

<script>
const DATA_BASE = './data/matchweek';

// LIVE mode: pass ?worker=https://your-worker.workers.dev to fetch direct
// from the Cloudflare proxy on every page-load. Falls back to static JSON
// if the worker errors or isn't supplied.
const WORKER_URL = (new URLSearchParams(location.search)).get('worker') || '';
const LIVE_MODE = !!WORKER_URL;

async function loadJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`fetch ${url} → ${r.status}`);
  return await r.json();
}

// Top-5 1st-XI cids (Essex League). Mirrored from app/build_matchweek.py.
const ESSEX_TOP5 = {
  2026: { 135282: "1st XI Premier Division", 135283: "1st XI Division One",
          135296: "1st XI Division Two", 135297: "1st XI Division Three",
          135298: "1st XI Division Four" },
  2025: { 125062: "1st XI Premier Division", 125063: "1st XI Division One",
          125064: "1st XI Division Two", 125065: "1st XI Division Three",
          125066: "1st XI Division Four" },
};

function fmtScore(inn) {
  if (!inn) return '–';
  return `${inn.runs ?? '–'}/${inn.wickets ?? '–'} ${inn.overs ? `(${inn.overs} ov)` : ''}`;
}

function topBatters(bat) {
  if (!bat) return [];
  return bat
    .filter(b => !['did not bat', 'absent', ''].includes(b.how_out || ''))
    .sort((a, b) => (parseInt(b.runs)||0) - (parseInt(a.runs)||0))
    .slice(0, 3);
}
function topBowlers(bowl) {
  if (!bowl) return [];
  return bowl
    .sort((a, b) => (parseInt(b.wickets)||0) - (parseInt(a.wickets)||0))
    .slice(0, 3);
}

async function buildLiveCard(matchSummary, division) {
  // Hit /match_detail.json via the worker
  const url = `${WORKER_URL}/match_detail.json?match_id=${matchSummary.id}`;
  const detail = await loadJSON(url);
  const md = (detail.match_details || [{}])[0];
  const result = md.result || '';
  const completed = ['W','L','T','D'].includes(result);
  const inProgress = !result && (md.innings || []).length > 0;
  return {
    match_id: parseInt(matchSummary.id),
    division,
    match_date: matchSummary.match_date,
    match_time: matchSummary.match_time,
    home_team_name: md.home_team_name,
    away_team_name: md.away_team_name,
    home_club_name: md.home_club_name,
    away_club_name: md.away_club_name,
    ground_name: md.ground_name,
    result, result_description: md.result_description,
    status: completed ? 'completed' : inProgress ? 'in_progress' :
            ['A','C','NR'].includes(result) ? 'abandoned' : 'scheduled',
    innings: (md.innings || []).map(inn => ({
      team_batting_name: inn.team_batting_name,
      runs: inn.runs, wickets: inn.wickets, overs: inn.overs,
      top_batters: topBatters(inn.bat).map(b => ({
        name: b.batsman_name, runs: b.runs, balls: b.balls,
        how_out: b.how_out,
      })),
      top_bowlers: topBowlers(inn.bowl).map(w => ({
        name: w.bowler_name, runs: w.runs, wickets: w.wickets,
        overs: w.overs, maidens: w.maidens,
      })),
    })),
    play_cricket_url: `https://essexcl.play-cricket.com/website/results/${matchSummary.id}`,
  };
}

async function loadLiveMatchweek(season, dateISO) {
  const cohort = ESSEX_TOP5[season];
  if (!cohort) throw new Error(`no cohort cids for season ${season}`);
  const summaries = await loadJSON(
    `${WORKER_URL}/matches.json?site_id=7300&season=${season}`
  );
  const matches = (summaries.matches || []).filter(m => {
    const cid = parseInt(m.competition_id);
    if (!(cid in cohort)) return false;
    const [d, mo, y] = (m.match_date || '').split('/');
    const iso = `${y}-${mo}-${d}`;
    return iso === dateISO;
  });
  // group by div, take 5 each
  const games = [];
  for (const cid of Object.keys(cohort).map(Number)) {
    const div = cohort[cid];
    const inDiv = matches
      .filter(m => parseInt(m.competition_id) === cid)
      .sort((a, b) => (a.match_time || '').localeCompare(b.match_time || ''))
      .slice(0, 5);
    for (const m of inDiv) {
      try {
        games.push(await buildLiveCard(m, div));
      } catch (e) {
        console.warn(`failed match_detail for ${m.id}:`, e);
      }
    }
  }
  return {
    matchweek: dateISO, season,
    built_at: new Date().toISOString() + ' (LIVE)',
    n_games: games.length,
    n_completed: games.filter(g => g.status === 'completed').length,
    n_in_progress: games.filter(g => g.status === 'in_progress').length,
    n_scheduled: games.filter(g => g.status === 'scheduled').length,
    games,
  };
}

function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function badge(status) {
  return `<span class="game-status status-${status}">${status.replace('_',' ')}</span>`;
}

function inningsBlock(inn) {
  if (!inn) return '';
  const score = `${inn.runs ?? '–'}/${inn.wickets ?? '–'} ${inn.overs ? `(${inn.overs} ov)` : ''}`;
  const battersHTML = (inn.top_batters || []).map(b => {
    const dot = b.how_out === 'not out' ? '*' : '';
    return `<span class="pill">${b.name || '?'} ${b.runs ?? 0}${dot}${b.balls ? ` (${b.balls})` : ''}</span>`;
  }).join('');
  const bowlersHTML = (inn.top_bowlers || []).filter(w => (w.wickets || 0) > 0).map(w =>
    `<span class="pill">${w.name || '?'} ${w.wickets}/${w.runs ?? 0}${w.overs ? ` (${w.overs})` : ''}</span>`
  ).join('');
  return `
    <div class="innings">
      <div class="innings-h">
        <span>${inn.team_batting_name || ''}</span>
        <span class="innings-score">${score}</span>
      </div>
      ${battersHTML ? `<div class="perf">${battersHTML}</div>` : ''}
      ${bowlersHTML ? `<div class="perf">${bowlersHTML}</div>` : ''}
    </div>`;
}

function winprobChip(g) {
  const wp = g.winprob;
  if (!wp || wp.at_innings1_end == null) return '';
  // p_bat_first_wins. Show from POV of the team batting first.
  // Need to identify which side that is — innings[0].team_batting_name.
  const batFirst = (g.innings && g.innings[0] && g.innings[0].team_batting_name)
                   || 'team batting first';
  const p1 = wp.at_innings1_end;
  const pf = wp.final;
  const pct = (p) => `${Math.round(p * 100)}%`;
  let label = `<b>${batFirst}</b> P(win) at innings break: <b>${pct(p1)}</b>`;
  if (pf != null) {
    const arrow = pf > p1 ? '↑' : pf < p1 ? '↓' : '→';
    label += ` ${arrow} <b>${pct(pf)}</b> at end`;
  }
  return `<div class="winprob" title="LightGBM model: innings1 BSS 0.20, chase BSS 0.53, isotonic-calibrated">${label}</div>`;
}

function gameCard(g) {
  const innings = (g.innings || []).map(inningsBlock).join('');
  const result = g.result_description ? `<div class="result">${g.result_description}</div>` : '';
  return `
    <div class="game">
      <div class="game-head">
        <span style="font-size:12px;color:#666;">${fmtDate(g.match_date.split('/').reverse().join('-')) === g.match_date ? g.match_date : g.match_date} ${g.match_time || ''}</span>
        ${badge(g.status)}
      </div>
      <div class="teams">${g.home_club_name || g.home_team_name} <span class="vs">v</span> ${g.away_club_name || g.away_team_name}</div>
      <div class="ground">${g.ground_name || ''}</div>
      ${innings}
      ${result}
      ${winprobChip(g)}
      <div style="margin-top:6px;"><a class="match-link" href="${g.play_cricket_url}" target="_blank" rel="noopener">match on Play-Cricket →</a></div>
    </div>`;
}

function render(data) {
  const content = document.getElementById('content');
  const built = document.getElementById('built');
  built.textContent = `built ${data.built_at} · ${data.n_completed} completed · ${data.n_in_progress} in progress · ${data.n_scheduled} scheduled`;

  if (!data.games || data.games.length === 0) {
    content.innerHTML = `<div class="empty">No games scheduled / loaded for this matchweek.</div>`;
    return;
  }

  // group by division
  const byDiv = {};
  for (const g of data.games) {
    if (!byDiv[g.division]) byDiv[g.division] = [];
    byDiv[g.division].push(g);
  }
  const order = ["1st XI Premier Division", "1st XI Division One",
                  "1st XI Division Two", "1st XI Division Three",
                  "1st XI Division Four"];
  let html = '';
  for (const div of order) {
    if (!byDiv[div]) continue;
    html += `<div class="div-h">${div}</div>`;
    html += byDiv[div].map(gameCard).join('');
  }
  content.innerHTML = html;
}

async function init() {
  let index;
  try {
    index = await loadJSON(`${DATA_BASE}/index.json`);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="empty">No matchweek data yet. Run <code>python3 app/build_matchweek.py</code> first.</div>`;
    return;
  }
  const sel = document.getElementById('mw');
  for (const e of index.matchweeks) {
    const opt = document.createElement('option');
    opt.value = e.matchweek;
    opt.textContent = `${e.matchweek}  (${e.completed} W / ${e.in_progress} P / ${e.scheduled} S)`;
    sel.appendChild(opt);
  }
  // default = today's matchweek per the rule (Thu-Sat: upcoming Sat;
  // Sun-Wed: previous Sat). Fall back to index.default if not built yet.
  const today = new Date();
  const wd = today.getDay();   // Sun=0..Sat=6
  let delta;
  if (wd === 0)      delta = -1;            // Sun -> -1
  else if (wd <= 3)  delta = -(wd + 1);     // Mon..Wed -> -2..-4
  else               delta = 6 - wd;        // Thu..Sat -> +2..0
  const target = new Date(today); target.setDate(today.getDate() + delta);
  const targetISO = target.toISOString().slice(0, 10);
  const haveIt = Array.from(sel.options).find(o => o.value === targetISO);
  sel.value = haveIt ? targetISO : index.default;
  async function loadAndRender(dateISO) {
    document.getElementById('content').innerHTML =
      `<div class="empty">${LIVE_MODE ? 'fetching live ...' : 'loading ...'}</div>`;
    let data;
    if (LIVE_MODE) {
      try {
        const season = parseInt(dateISO.slice(0, 4));
        data = await loadLiveMatchweek(season, dateISO);
      } catch (e) {
        console.warn('live fetch failed, falling back to static:', e);
        try { data = await loadJSON(`${DATA_BASE}/${dateISO}.json`); }
        catch (_) {
          document.getElementById('content').innerHTML =
            `<div class="empty">Live fetch failed and no static snapshot for ${dateISO}.</div>`;
          return;
        }
      }
    } else {
      data = await loadJSON(`${DATA_BASE}/${dateISO}.json`);
    }
    render(data);
  }

  sel.addEventListener('change', () => loadAndRender(sel.value));
  await loadAndRender(sel.value);
}

init();
</script>
</body>
</html>
