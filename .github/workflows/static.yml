# Simple workflow for deploying static content to GitHub Pages.
#
# Fires only on pushes to `main` — i.e. when a feature branch is merged
# in. Branch pushes during development do NOT publish.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site content
        # Pages artifacts cap at 10 GB and reject symlinks. The repo also
        # carries a large committed data cache (data/rainham.db + data/raw,
        # ~18 GB) that must NOT be published. Stage only the actual site
        # dirs, and use `cp -rL` to dereference the
        # `reports/scouting/.../latest` symlinks into real directories.
        run: |
          mkdir -p _site
          cp -rL app _site/app
          cp -rL reports _site/reports
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <title>Rainham CC — Play-Cricket</title>
          <meta http-equiv="refresh" content="0; url=app/index.html">
          <a href="app/index.html">Rainham CC data repository</a>
          EOF
          echo "Staged site contents:"; du -sh _site
          if find _site -type l | grep -q .; then
            echo "ERROR: symlinks remain in _site"; find _site -type l; exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
