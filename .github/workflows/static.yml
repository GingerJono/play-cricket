# Simple workflow for deploying static content to GitHub Pages.
#
# IMPORTANT: this fires on **every push to every branch**, not just main.
# Whatever's at the head of the branch you just pushed becomes the live
# Pages deployment. There's a single "pages" concurrency slot, so
# whichever branch pushed most recently wins.
#
# Why: the user (and Claude) iterate on scouting reports / index.html on
# feature branches and want the changes immediately visible at the
# published URL — there's no staging environment, no separate preview.
# Treat every `git push` as a production publish.
name: Deploy static content to Pages

on:
  # Runs on every push, regardless of branch.
  push:
    branches: ["**"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
